<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AGENTS AI Limited</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Roboto+Slab:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
          --background: 224 71% 4%; /* zinc-950 */
          --foreground: 210 40% 98%; /* zinc-50 */
          --card: 220 20% 9%; /* almost zinc-900 */
          --card-foreground: 210 40% 98%; /* zinc-50 */
          --popover: 224 71% 4%; /* zinc-950 */
          --popover-foreground: 210 40% 98%; /* zinc-50 */
          --primary: 142 76% 51%; /* emerald-400 */
          --primary-foreground: 142 76% 15%;
          --secondary: 220 15% 15%; /* zinc-800 */
          --secondary-foreground: 210 40% 98%; /* zinc-50 */
          --muted: 220 15% 15%; /* zinc-800 */
          --muted-foreground: 220 9% 55%; /* zinc-400 */
          --accent: 220 15% 15%; /* zinc-800 */
          --accent-foreground: 210 40% 98%; /* zinc-50 */
          --destructive: 0 70% 50%;
          --destructive-foreground: 0 0% 98%;
          --border: 220 13% 25%; /* zinc-800 slightly lighter */
          --input: 220 13% 25%;
          --ring: 142 76% 51%; /* emerald-400 */
          --radius: 0.75rem;
          --x: 50%;
          --y: 50%;
        }

        .dark {
          --background: 224 71% 4%;
          --foreground: 210 40% 98%;
          --card: 220 20% 9%;
          --card-foreground: 210 40% 98%;
          --popover: 224 71% 4%;
          --popover-foreground: 210 40% 98%;
          --primary: 142 60% 55%;
          --primary-foreground: 142 76% 15%;
          --secondary: 220 15% 15%;
          --secondary-foreground: 210 40% 98%;
          --muted: 220 15% 15%;
          --muted-foreground: 220 9% 55%;
          --accent: 220 15% 15%;
          --accent-foreground: 210 40% 98%;
          --destructive: 0 70% 50%;
          --destructive-foreground: 0 0% 98%;
          --border: 220 13% 25%;
          --input: 220 13% 25%;
          --ring: 142 76% 51%;
        }

        html {
          scroll-behavior: smooth;
        }
        
        body {
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
          width: 12px;
        }
        ::-webkit-scrollbar-track {
          background: hsl(var(--background));
        }
        ::-webkit-scrollbar-thumb {
          background-color: hsl(var(--border));
          border-radius: 10px;
          border: 3px solid hsl(var(--background));
        }
        ::-webkit-scrollbar-thumb:hover {
          background-color: hsl(var(--muted-foreground));
        }
        
        body {
            scrollbar-width: thin;
            scrollbar-color: hsl(var(--border)) hsl(var(--background));
        }

        .grid-background {
            position: relative;
            background-color: hsl(var(--background));
        }
        .grid-background::before {
            content: '';
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(to right, hsl(var(--border)) 1px, transparent 1px),
                linear-gradient(to bottom, hsl(var(--border)) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.1;
            z-index: 0;
        }
        
        #spotlight {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            pointer-events: none;
            background: radial-gradient(circle at var(--x) var(--y), transparent 5%, hsla(var(--background), 1) 25%);
            z-index: 0;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }
        body:hover #spotlight {
            opacity: 1;
        }

        #root {
            position: relative;
            z-index: 1;
        }
        
        h1, h2, h3, h4 {
            font-family: 'Inter', 'Roboto Slab', 'Noto Sans SC', serif;
            letter-spacing: -0.025em;
            font-weight: 700;
        }
        
        .text-primary {
          color: hsl(var(--primary));
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: hsl(var(--primary));
            color: hsl(var(--primary-foreground));
            font-weight: 600;
            border-radius: 9999px;
            transition: all 0.2s ease-in-out;
        }
        .btn-primary:hover {
            background-color: hsl(142 76% 60%);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px hsla(var(--primary), 0.3), 0 0 15px -3px hsla(var(--primary), 0.4);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: hsl(var(--secondary));
            border: 1px solid hsl(var(--border));
            color: hsl(var(--secondary-foreground));
            font-weight: 600;
            border-radius: 9999px;
            transition: all 0.2s ease-in-out;
        }
        .btn-secondary:hover {
            background-color: hsl(var(--muted));
            border-color: hsl(var(--primary));
            transform: translateY(-2px);
            box-shadow: 0 0 15px -3px hsla(var(--primary), 0.2);
        }

        /* animations */
        @keyframes slide-in-right {
          from { transform: translateX(100%); opacity: 0; }
          to { transform: translateX(0); opacity: 1; }
        }
        .animate-slide-in-right { animation: slide-in-right 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        
        @keyframes fade-in-backdrop {
          from { opacity: 0; }
          to { opacity: 1; }
        }
        .animate-fade-in-backdrop { animation: fade-in-backdrop 0.3s ease-in-out; }

        @keyframes scale-in {
          from { opacity: 0; transform: scale(0.95); }
          to { opacity: 1; transform: scale(1); }
        }
        .animate-scale-in { animation: scale-in 0.3s ease-out; }
        
        @keyframes slide-in-up {
          from { opacity: 0; transform: translateY(30px) scale(0.98); }
          to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-slide-in-up {
          animation: slide-in-up 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        @keyframes fade-in {
          from { opacity: 0; }
          to { opacity: 1; }
        }
        .animate-fade-in { animation: fade-in 0.5s ease-out; }

        @keyframes fade-in-message {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-message { animation: fade-in-message 0.3s ease-out; }

        .typing-indicator span {
          height: 8px;
          width: 8px;
          border-radius: 50%;
          display: inline-block;
          margin: 0 1px;
          animation: bounce-pulse 1.4s infinite;
        }
        .typing-indicator span:nth-of-type(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-of-type(3) { animation-delay: 0.4s; }

        @keyframes bounce-pulse {
          0%, 60%, 100% { transform: translateY(0); background-color: hsl(var(--muted-foreground)); }
          30% { transform: translateY(-6px); background-color: hsl(var(--primary)); }
        }

        /* Accessibility class */
        .sr-only {
          position: absolute;
          width: 1px;
          height: 1px;
          padding: 0;
          margin: -1px;
          overflow: hidden;
          clip: rect(0, 0, 0, 0);
          white-space: nowrap;
          border-width: 0;
        }
    </style>

</head>

    <div id="spotlight"></div>
    <div id="root"></div>

</html>
